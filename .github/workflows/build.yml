name: Build and deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install DITA Open Toolkit
        run: |
          curl -L -o dita-ot.zip https://github.com/dita-ot/dita-ot/releases/download/4.4.1/dita-ot-4.4.1.zip
          unzip -q dita-ot.zip
          echo "$PWD/dita-ot-4.4.1/bin" >> "$GITHUB_PATH"

      - name: Check DITA-OT version
        run: dita --version

      - name: Build both versions
        run: ./build.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4